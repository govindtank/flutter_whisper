name: flutter_whisper
description: On-device speech-to-text transcription using whisper.cpp. Automatic model download, streaming results, iOS/Android support.
version: 0.1.0
homepage: https://github.com/govindtank/flutter_whisper
repository: https://github.com/govindtank/flutter_whisper
issue_tracker: https://github.com/govindtank/flutter_whisper/issues

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  http: ^1.2.0
  archive: ^4.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.govindtank.flutter_whisper
        pluginClass: FlutterWhisperPlugin
      ios:
        pluginClass: FlutterWhisperPlugin
