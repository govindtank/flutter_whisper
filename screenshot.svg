<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #F8FAFC; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #94A3B8; }
    .code-font { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #E2E8F0; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; }
    .card-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #F1F5F9; }
    .text-dim { fill: #64748B; }
    .feature-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #38BDF8; }
    .feature-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 12px; fill: #94A3B8; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="65" x2="900" y2="65" />
    <line x1="0" y1="130" x2="900" y2="130" />
    <line x1="0" y1="195" x2="900" y2="195" />
    <line x1="0" y1="260" x2="900" y2="260" />
    <line x1="0" y1="325" x2="900" y2="325" />
    <line x1="0" y1="390" x2="900" y2="390" />
    <line x1="0" y1="455" x2="900" y2="455" />
    <line x1="150" y1="0" x2="150" y2="520" />
    <line x1="300" y1="0" x2="300" y2="520" />
    <line x1="450" y1="0" x2="450" y2="520" />
    <line x1="600" y1="0" x2="600" y2="520" />
    <line x1="750" y1="0" x2="750" y2="520" />
  </g>

  <!-- Ambient Glows -->
  <circle cx="200" cy="120" r="140" fill="#0284C7" opacity="0.12" filter="url(#glow)" />
  <circle cx="700" cy="400" r="160" fill="#38BDF8" opacity="0.08" filter="url(#glow)" />

  <!-- LEFT: Mobile UI Simulation Card -->
  <g transform="translate(45, 40)" filter="url(#cardShadow)">
    <!-- App Container Frame -->
    <rect width="400" height="440" rx="20" fill="#0F172A" stroke="#334155" stroke-width="1.5" />

    <!-- Top App Bar -->
    <rect width="400" height="52" rx="20" fill="#1E293B" />
    <rect y="32" width="400" height="20" fill="#1E293B" />
    <circle cx="28" cy="26" r="6" fill="#F43F5E" />
    <circle cx="46" cy="26" r="6" fill="#EAB308" />
    <circle cx="64" cy="26" r="6" fill="#10B981" />
    <text x="200" y="31" text-anchor="middle" class="card-header" font-size="13">Flutter Whisper Demo</text>

    <!-- Model Selector Bar -->
    <g transform="translate(20, 68)">
      <rect width="360" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" class="subtitle" font-size="11">Active Model:</text>
      
      <rect x="95" y="6" width="90" height="26" rx="6" fill="#0284C7" />
      <text x="140" y="23" text-anchor="middle" fill="#FFFFFF" class="pill-text">base (143 MB)</text>

      <rect x="195" y="6" width="60" height="26" rx="6" fill="#334155" />
      <text x="225" y="23" text-anchor="middle" fill="#94A3B8" class="pill-text">tiny</text>

      <rect x="263" y="6" width="65" height="26" rx="6" fill="#334155" />
      <text x="295.5" y="23" text-anchor="middle" fill="#94A3B8" class="pill-text">small</text>
    </g>

    <!-- Recording Indicator & Waveform -->
    <g transform="translate(20, 120)">
      <rect width="360" height="74" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
      
      <!-- Pulsing Mic Button -->
      <circle cx="46" cy="37" r="24" fill="#F43F5E" opacity="0.25" />
      <circle cx="46" cy="37" r="18" fill="url(#accentGrad)" />
      <!-- Mic Icon -->
      <rect x="43" y="28" width="6" height="11" rx="3" fill="#FFFFFF" />
      <path d="M 40 34 C 40 39, 52 39, 52 34" stroke="#FFFFFF" stroke-width="2" fill="none" />
      <line x1="46" y1="39" x2="46" y2="44" stroke="#FFFFFF" stroke-width="2" />

      <!-- Duration counter -->
      <text x="82" y="32" class="card-header" font-size="14">Live Recording</text>
      <text x="82" y="49" class="code-font" fill="#F43F5E" font-weight="bold">00:06.40 • 16 kHz Mono</text>

      <!-- Waveform Bars -->
      <g transform="translate(240, 20)" fill="#38BDF8">
        <rect x="0" y="12" width="3" height="18" rx="1.5" />
        <rect x="6" y="8" width="3" height="26" rx="1.5" />
        <rect x="12" y="4" width="3" height="34" rx="1.5" />
        <rect x="18" y="14" width="3" height="14" rx="1.5" />
        <rect x="24" y="2" width="3" height="38" rx="1.5" />
        <rect x="30" y="10" width="3" height="22" rx="1.5" />
        <rect x="36" y="6" width="3" height="30" rx="1.5" />
        <rect x="42" y="15" width="3" height="12" rx="1.5" />
        <rect x="48" y="3" width="3" height="36" rx="1.5" />
        <rect x="54" y="9" width="3" height="24" rx="1.5" />
        <rect x="60" y="13" width="3" height="16" rx="1.5" />
        <rect x="66" y="16" width="3" height="10" rx="1.5" />
        <rect x="72" y="14" width="3" height="14" rx="1.5" />
        <rect x="78" y="7" width="3" height="28" rx="1.5" />
        <rect x="84" y="12" width="3" height="18" rx="1.5" />
        <rect x="90" y="15" width="3" height="12" rx="1.5" />
      </g>
    </g>

    <!-- Live Transcription Output Area -->
    <g transform="translate(20, 206)">
      <!-- Segment 1 -->
      <rect width="360" height="96" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      
      <!-- Timestamp Badge -->
      <rect x="12" y="10" width="86" height="20" rx="5" fill="#0369A1" />
      <text x="55" y="24" text-anchor="middle" fill="#E0F2FE" class="pill-text" font-size="10">00:00 - 00:03</text>
      
      <text x="106" y="24" fill="#34D399" class="pill-text" font-size="10">Lang: EN</text>

      <text x="12" y="48" class="code-font" font-size="12">Welcome to Flutter Whisper on-device</text>
      <text x="12" y="66" class="code-font" font-size="12">speech recognition.</text>

      <!-- Word timestamp mini chips -->
      <rect x="12" y="76" width="56" height="14" rx="3" fill="#0F172A" />
      <text x="40" y="86" text-anchor="middle" class="code-font" font-size="9" fill="#94A3B8">Welcome(0.2s)</text>

      <rect x="72" y="76" width="36" height="14" rx="3" fill="#0F172A" />
      <text x="90" y="86" text-anchor="middle" class="code-font" font-size="9" fill="#94A3B8">to(0.6s)</text>

      <rect x="112" y="76" width="56" height="14" rx="3" fill="#0F172A" />
      <text x="140" y="86" text-anchor="middle" class="code-font" font-size="9" fill="#94A3B8">Flutter(0.9s)</text>

      <rect x="172" y="76" width="60" height="14" rx="3" fill="#0F172A" />
      <text x="202" y="86" text-anchor="middle" class="code-font" font-size="9" fill="#94A3B8">Whisper(1.4s)</text>
    </g>

    <!-- Segment 2 -->
    <g transform="translate(20, 312)">
      <rect width="360" height="66" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      
      <rect x="12" y="10" width="86" height="20" rx="5" fill="#0369A1" />
      <text x="55" y="24" text-anchor="middle" fill="#E0F2FE" class="pill-text" font-size="10">00:03 - 00:06</text>

      <text x="12" y="48" class="code-font" font-size="12">Transcribing audio locally without cloud APIs.</text>
    </g>

    <!-- Export Action Bar -->
    <g transform="translate(20, 390)">
      <rect x="0" y="0" width="112" height="34" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="56" y="21" text-anchor="middle" fill="#38BDF8" class="pill-text">Export SRT</text>

      <rect x="122" y="0" width="112" height="34" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="178" y="21" text-anchor="middle" fill="#38BDF8" class="pill-text">Export VTT</text>

      <rect x="244" y="0" width="116" height="34" rx="8" fill="#0284C7" />
      <text x="302" y="21" text-anchor="middle" fill="#FFFFFF" class="pill-text">Copy Text</text>
    </g>
  </g>

  <!-- RIGHT: Architectural Highlights & Features -->
  <g transform="translate(480, 50)">
    <!-- Main Title -->
    <text x="0" y="32" class="title">flutter_whisper</text>
    <text x="0" y="56" class="subtitle" font-size="14">On-Device Speech-to-Text Engine for Flutter</text>

    <!-- Badges Row -->
    <g transform="translate(0, 72)">
      <rect width="82" height="24" rx="6" fill="#0284C7" />
      <text x="41" y="16" text-anchor="middle" fill="#FFFFFF" class="pill-text">whisper.cpp</text>

      <rect x="90" y="0" width="84" height="24" rx="6" fill="#059669" />
      <text x="132" y="16" text-anchor="middle" fill="#FFFFFF" class="pill-text">100% Offline</text>

      <rect x="182" y="0" width="88" height="24" rx="6" fill="#475569" />
      <text x="226" y="16" text-anchor="middle" fill="#FFFFFF" class="pill-text">ARM NEON</text>
    </g>

    <!-- Feature Cards List -->
    <!-- Feature 1 -->
    <g transform="translate(0, 120)">
      <rect width="375" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="32" r="14" fill="#0284C7" opacity="0.2" />
      <text x="28" y="37" text-anchor="middle" fill="#38BDF8" font-size="15">🔒</text>
      <text x="54" y="27" class="feature-title">Privacy-First &amp; Zero Cloud Latency</text>
      <text x="54" y="46" class="feature-desc">Transcribes audio entirely on-device. No API keys or server fees.</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(0, 194)">
      <rect width="375" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="32" r="14" fill="#059669" opacity="0.2" />
      <text x="28" y="37" text-anchor="middle" fill="#10B981" font-size="15">⏱️</text>
      <text x="54" y="27" class="feature-title">Segment &amp; Word-Level Timestamps</text>
      <text x="54" y="46" class="feature-desc">Accurate millisecond timestamps for subtitle and audio sync.</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(0, 268)">
      <rect width="375" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="32" r="14" fill="#F43F5E" opacity="0.2" />
      <text x="28" y="37" text-anchor="middle" fill="#F43F5E" font-size="15">📝</text>
      <text x="54" y="27" class="feature-title">Built-in SRT &amp; WebVTT Exporters</text>
      <text x="54" y="46" class="feature-desc">Export directly with toSrt(), toVtt(), or structured JSON.</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(0, 342)">
      <rect width="375" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="32" r="14" fill="#8B5CF6" opacity="0.2" />
      <text x="28" y="37" text-anchor="middle" fill="#A78BFA" font-size="15">🧠</text>
      <text x="54" y="27" class="feature-title">5 Quantized Model Sizes</text>
      <text x="54" y="46" class="feature-desc">Automatic resumable downloads for tiny, base, small, medium, large.</text>
    </g>
  </g>
</svg>
