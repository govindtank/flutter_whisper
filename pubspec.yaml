name: flutter_whisper
description: On-device speech-to-text transcription using whisper.cpp. Automatic model download, streaming segment results, Android support.
version: 0.1.0
homepage: https://github.com/govindtank/flutter_whisper
repository: https://github.com/govindtank/flutter_whisper
issue_tracker: https://github.com/govindtank/flutter_whisper/issues
topics:
  - speech-to-text
  - whisper
  - transcription
  - on-device
  - android

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.govindtank.flutter_whisper
        pluginClass: FlutterWhisperPlugin
